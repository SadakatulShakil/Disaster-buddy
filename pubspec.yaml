name: bipod_bondhu
description: "Bipod Bondhu — Disaster preparedness for kids (Flood, Lightning, Earthquake)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation
  get: ^4.6.6

  # Responsive sizing
  flutter_screenutil: ^5.9.3

  # Local prefs (UserPrefService singleton wraps this)
  shared_preferences: ^2.3.2

  # Local database (added properly in Phase 1)
  floor: ^1.4.2
  sqflite: ^2.3.0

  # Value equality for immutable domain entities
  equatable: ^2.0.5

  # Narration (free TTS for the no-donor version)
  flutter_tts: ^4.2.0

  # Vector art for slides / icons
  flutter_svg: ^2.0.10+1

  # Mascot mood animations (Lottie files dropped in later; MascotView falls
  # back to a native animation while none are bundled)
  lottie: ^3.1.3

  # Family emergency plan PDF (used in Phase 5)
  pdf: ^3.11.1
  printing: ^5.13.3

  cupertino_icons: ^1.0.8

  # Short joyful sound effects (SoundService) — separate from flutter_tts,
  # which is speech-only.
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Floor codegen (Phase 1)
  floor_generator: ^1.4.2
  build_runner: ^2.4.12

  # Runs Floor/sqflite against a real sqlite engine in the Dart VM, for
  # testing migrations without a device/emulator (Phase 4)
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/content/activities/
    - assets/content/daily/
    - assets/images/
    - assets/images/icons/
    - assets/images/mascot/
    - assets/images/activities/kit/
    - assets/images/activities/safe_spot/
    - assets/images/activities/signal_colours/
    - assets/icons/
    - assets/audio/
    - assets/audio/sfx/
    - assets/images/story/
    - assets/images/steps/
    - assets/images/practice/
    - assets/images/quiz/

  # --- Bangla font ---
  # Download Hind Siliguri (Google Fonts, free) and drop the 4 .ttf files
  # into assets/fonts/, then UNCOMMENT this block. Until then the app
  # runs with the system font (Bangla still renders on Android).
  #
  # fonts:
  #   - family: HindSiliguri
  #     fonts:
  #       - asset: assets/fonts/HindSiliguri-Regular.ttf
  #       - asset: assets/fonts/HindSiliguri-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/HindSiliguri-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/HindSiliguri-Bold.ttf
  #         weight: 700
